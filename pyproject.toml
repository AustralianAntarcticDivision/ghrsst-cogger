[project]
name = "ghrsst-cogger"
version = "0.13.0-rc1"
description = "Convert GHRSST MUR NetCDF to Cloud Optimised GeoTIFFs with STAC metadata"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiohttp>=3.11.11",
    "awslambdaric>=3.0.1",
    "click>=8.1.8",
    "dask>=2025.1.0",
    "earthaccess>=0.13.0",
    "fsspec>=2024.12.0",
    "h5netcdf>=1.5.0",
    "netcdf4>=1.7.2",
    "odc-cloud>=0.2.5",
    "odc-geo[tiff]>=0.4.9.post0",
    "pystac>=1.12.1",
    "rasterio>=1.4.3",
    "requests>=2.32.3",
    "rio-stac>=0.10.1",
    "s3path>=0.6.0",
    "shapely>=2.0.7",
    "stacrs>=0.5.3",
    "xarray>=2025.1.1",
]

[dependency-groups]
dev = [
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghrsst"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, import sorting, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["ghrsst", "tests"]
exclude = ["**/*.ipynb"]
