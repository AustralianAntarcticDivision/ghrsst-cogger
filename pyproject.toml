[project]
name = "ghrsst-cogger"
version = "0.14.0"
description = "Convert GHRSST MUR NetCDF to Cloud Optimised GeoTIFFs with STAC metadata"
readme = "README.md"
requires-python = "==3.12.*"
# Lower bound = latest at upgrade time. Upper bound = next major, or next minor for 0.x
# (where minors can break). Calendar-versioned packages (dask, fsspec, xarray) have no cap.
dependencies = [
    "aiohttp>=3.14.5,<4",
    "awslambdaric>=4.2.2,<5",
    "boto3>=1.43.106,<2",
    "click>=8.5.0,<9",
    "dask>=2026.8.0",
    "fsspec>=2026.9.0",
    "h5netcdf[h5py]>=1.8.1,<2",
    "netcdf4>=1.7.5,<2",
    "odc-geo[tiff]>=0.5.3,<0.6",
    "pystac>=1.15.2,<2",
    "rasterio>=1.5.2,<2",
    "requests>=2.34.2,<3",
    "rio-stac>=0.12.0,<0.13",
    "rustac>=0.9.17,<0.10",
    "s3path>=0.6.5,<0.7",
    "xarray>=2026.9.0",
    "xvrt>=0.1.0,<0.2",
]

[dependency-groups]
dev = [
    "prek>=0.5.6,<0.6",
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
    "ty>=0.0.89,<0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ghrsst"]

[tool.ruff]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Pyflakes, pycodestyle errors, import sorting, pyupgrade, bugbear
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["ghrsst", "tests"]
exclude = ["**/*.ipynb"]

[tool.pytest.ini_options]
markers = [
    "network: talks to the real CMR, PO.DAAC archive and source.coop (run with -m network)",
]
addopts = "-m 'not network'"
